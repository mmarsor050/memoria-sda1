<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memoria Hecho a medida</title>
<meta name="description" content="Memoria técnica online del proyecto Hecho a medida (soporte de móvil), Tecnología 4.º ESO.">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1d2433; --muted:#5d6676; --line:#d5dbe4; --soft:#eaf1fb;
  --blue:#2e75b6; --blue-d:#1f4f80; --red:#c00000; --green:#2e7d32; --amber:#fff4d6; --amber-b:#e0a800;
  --en:#6b7280; --focus:#ffbf47;
  --fs:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181f; --card:#1d232d; --ink:#e8ecf2; --muted:#a3acba; --line:#333c4a; --soft:#1e2e44;
    --blue:#5aa2e6; --blue-d:#8cc2f5; --red:#ff6b6b; --green:#66bb6a; --amber:#3a3220; --amber-b:#c9a227; --en:#9aa3b2;
  }
}
:root[data-theme="dark"]{
  --bg:#14181f; --card:#1d232d; --ink:#e8ecf2; --muted:#a3acba; --line:#333c4a; --soft:#1e2e44;
  --blue:#5aa2e6; --blue-d:#8cc2f5; --red:#ff6b6b; --green:#66bb6a; --amber:#3a3220; --amber-b:#c9a227; --en:#9aa3b2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.en{color:var(--en);font-style:italic;font-size:.86em}
.es + .en{display:block}
.inline .es + .en{display:inline;margin-left:.4em}
[hidden]{display:none!important}

/* Barra superior */
header.top{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;box-shadow:0 2px 6px #0003}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;margin-right:auto;line-height:1.2}
.brand small{display:block;font-weight:400;opacity:.85;font-size:.75rem}
.tbtn{background:#ffffff22;border:1px solid #ffffff55;color:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.tbtn:hover{background:#ffffff33}
.tbtn.main{background:#fff;color:var(--blue-d);font-weight:700;border-color:#fff}
select.tsel{background:#ffffff22;border:1px solid #ffffff55;color:#fff;border-radius:10px;padding:7px 8px;font-size:.9rem}
select.tsel option{color:#000}
.progress{height:6px;background:#ffffff33}
.progress > i{display:block;height:100%;background:#9fe0a5;width:0;transition:width .3s}
.modebadge{background:#fff3;border-radius:999px;padding:2px 10px;font-size:.78rem}

/* Distribución */
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:18px;padding:16px}
nav.side{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
nav.side button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.92rem;line-height:1.3}
nav.side button:hover{background:var(--soft)}
nav.side button.on{background:var(--soft);font-weight:700;outline:2px solid var(--blue)}
nav.side .st{flex:0 0 1.4em;text-align:center}
.mobnav{display:none}
main{min-width:0}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:10px 16px}
  nav.side{display:none}
  .mobnav{display:block;margin-bottom:10px}
  .mobnav select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1rem}
  :root{--fs:17px}
}

/* Página */
.page{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
.ph{display:flex;align-items:center;gap:10px;margin:-20px -22px 16px;padding:14px 22px;border-radius:16px 16px 0 0;color:#fff}
.ph h1{margin:0;font-size:1.35rem;line-height:1.25}
.ph h1 .en{color:#ffffffcc;font-size:.8em;display:block}
.ph .tipo{margin-left:auto;font-size:.85rem;background:#ffffff2e;border-radius:999px;padding:3px 10px;white-space:nowrap}
.que{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.que > div{background:var(--soft);border-radius:12px;padding:10px 14px}
.que b{display:block;color:var(--blue-d);font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
@media (max-width:640px){.que{grid-template-columns:1fr}}
.pasos{background:var(--soft);border-left:5px solid var(--blue);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.pasos ol{margin:.3em 0 0;padding-left:1.4em}
.pasos li{margin:.25em 0}
.ej{background:var(--amber);border-left:5px solid var(--amber-b);border-radius:10px;padding:10px 14px;margin:0 0 14px}
.ej b.t{display:block;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
details.help{border:1px dashed var(--line);border-radius:10px;padding:6px 12px;margin:0 0 14px;background:var(--card)}
details.help summary{cursor:pointer;font-weight:600;color:var(--blue-d)}
details.help svg{max-width:100%;height:auto;display:block;margin:8px auto}

.f{border-top:1px solid var(--line);padding:14px 0}
.f:first-of-type{border-top:0}
.q{font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.q .txt{flex:1}
.star{color:var(--red);font-weight:800}
.say{border:1px solid var(--line);background:var(--card);border-radius:999px;cursor:pointer;padding:0 8px;font-size:.9rem;line-height:1.8;flex:0 0 auto}
.say:hover{background:var(--soft)}
input[type=text],input[type=number],textarea,select.inp{width:100%;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
input[type=number]{max-width:9em}
textarea{min-height:5.2em;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible,.slot:focus{outline:3px solid var(--focus);outline-offset:1px}
.unit{margin-left:6px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;background:var(--card);min-height:46px}
.opt input{width:20px;height:20px;accent-color:var(--blue)}
.opt:has(input:checked){border-color:var(--blue);background:var(--soft)}
.opt.wide{flex:1 1 100%}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--soft);font-weight:700}
table.t td.c,table.t th.c{text-align:center}
table.t input[type=radio]{width:22px;height:22px;accent-color:var(--blue)}
.tscroll{overflow-x:auto}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--blue);color:var(--blue-d);background:var(--soft);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.9rem}
.frase{line-height:2.5}
.frase input{display:inline-block;width:auto;min-width:9em;max-width:100%;padding:4px 8px;border-width:0 0 2px;border-radius:0;background:transparent}
.calc{background:var(--soft);border-radius:10px;padding:10px 14px;font-weight:600}
.ok{color:var(--green);font-weight:700}
.bad{color:var(--red);font-weight:700}
.note{color:var(--muted);font-size:.92rem}
.sub{font-size:1.08rem;font-weight:700;margin:16px 0 4px;color:var(--blue-d)}
.cardv{border:2px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--card)}
.cardv .big{font-size:1.5rem;font-weight:800}
.cardv .prob{font-weight:700;text-decoration:underline;margin:6px 0}
.cardv table{margin-top:8px}

/* Fotos */
.slot{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--bg)}
.slot img{max-width:100%;max-height:360px;border-radius:8px;display:block;margin:0 auto 8px}
.slot .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{border:2px solid var(--blue);background:var(--card);color:var(--blue-d);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn.del{border-color:var(--red);color:var(--red)}

/* Pie de página */
.pfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:2px solid var(--line)}
.falta{background:#fdecec;color:#7a1010;border-radius:10px;padding:10px 14px;margin-top:12px}
:root[data-theme="dark"] .falta{background:#3a1d1d;color:#ffc9c9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .falta{background:#3a1d1d;color:#ffc9c9}}
.done{background:#e6f4ea;color:#14532d;border-radius:10px;padding:10px 14px;margin-top:12px;font-weight:600}
:root[data-theme="dark"] .done{background:#1d3324;color:#bfe6c8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done{background:#1d3324;color:#bfe6c8}}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.stepcount{color:var(--muted);font-size:.9rem;text-align:center;margin-top:6px}

/* Modales y avisos */
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal .box{background:var(--card);border-radius:16px;max-width:720px;width:100%;padding:20px 22px;box-shadow:0 10px 40px #0006}
.modal h2{margin:0 0 10px;font-size:1.3rem}
.modal textarea.code{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;min-height:9em;word-break:break-all}
.modal .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;box-shadow:0 6px 20px #0005;max-width:92vw}
.gl{border:0;background:none;padding:0;color:inherit;text-decoration:underline dotted var(--blue) 2px;text-underline-offset:3px;cursor:help;font:inherit}
.glpop{position:absolute;z-index:70;max-width:320px;background:var(--card);border:2px solid var(--blue);border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px #0004;font-size:.92rem}
.guide{counter-reset:g;list-style:none;padding:0;margin:8px 0}
.guide li{counter-increment:g;display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.guide li::before{content:counter(g);flex:0 0 30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}

/* Vista de impresión */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;font-size:11pt}
  header.top,.wrap,.modal,.toast,.glpop{display:none!important}
  #print{display:block}
  .en{color:#555}
}
.rep .pp{page-break-after:always;break-after:page}
.rep .pp:last-child{page-break-after:auto}
.rep h2 .en{color:#e8f0fa}
.rep h2{background:#2e75b6;color:#fff;padding:6px 10px;margin:0 0 8px;font-size:14pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rep .pq{margin:7px 0 2px;font-weight:700;font-size:10.5pt}
.rep .pa{border-bottom:1px solid #999;min-height:1.4em;padding:1px 4px;white-space:pre-wrap;font-size:10.5pt}
.rep .pa.empty{min-height:1.6em}
.rep .pa.big{min-height:4.8em}
.rep table{border-collapse:collapse;width:100%;font-size:9.5pt;margin:3px 0}
.rep th,.rep td{border:1px solid #888;padding:3px 5px;text-align:left}
.rep img{max-width:100%;max-height:85mm;display:block;margin:4px 0}
.rep .pbox{border:1.5px dashed #888;height:55mm;display:flex;align-items:center;justify-content:center;color:#777;font-size:9pt}
.rep .firma{display:flex;justify-content:space-between;gap:10px;margin-top:10px;border:1px solid #888;padding:6px 8px;font-size:9pt;min-height:16mm}
.rep .cover{font-size:11pt}
.rep .cover h1{font-size:22pt;margin:0}
</style>
</head>

const LIMITS = {L:120, A:100, H:130, horas:2};

/* ---------- utilidades de texto bilingüe ---------- */
const L = (es, en) => ({es, en: en || ''});
const S = {lang:'both', mode:'n', page:0, data:{}, step:{}, photos:{}, lastCode:0, dirty:false};

function esc(s){return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gl(s){ // [[clave|texto]] o [[clave]] -> botón de glosario
  return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,k,t)=>`<button type="button" class="gl" data-gl="${esc(k)}">${t||k}</button>`);
}
function plain(s){return String(s||'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,t)=>t||k).replace(/<[^>]+>/g,'');}
function tx(o, lang){ if(o==null) return ''; if(typeof o==='string') return o; lang = lang||S.lang;
  if(lang==='es') return o.es; if(lang==='en') return o.en||o.es; return o.es; }
function bi(o, inline){ // HTML bilingüe
  if(o==null) return ''; if(typeof o==='string') return gl(o);
  if(S.lang==='es') return `<span class="es">${gl(o.es)}</span>`;
  if(S.lang==='en') return `<span class="es">${gl(o.en||o.es)}</span>`;
  if(!o.en) return `<span class="es">${gl(o.es)}</span>`;
  return `<span class="${inline?'inline':''}"><span class="es">${gl(o.es)}</span><span class="en">${gl(o.en)}</span></span>`;
}
function biP(o){ // para impresión: ES + EN en línea
  if(o==null) return ''; if(typeof o==='string') return esc(plain(o));
  if(S.lang==='es') return esc(plain(o.es)); if(S.lang==='en') return esc(plain(o.en||o.es));
  return esc(plain(o.es)) + (o.en?` <span class="en">${esc(plain(o.en))}</span>`:'');
}
function sayText(o){ if(typeof o==='string') return plain(o); return plain(S.lang==='en' ? (o.en||o.es) : o.es); }

/* ---------- glosario ---------- */

/* ---------- tarjetas de situación ---------- */
const CARDS = [
 {n:0, emoji:'🍳', nombre:'Antonio', rol:L('Jubilado, cocina para su familia','Retired, cooks for his family'),

/* ---------- utilidades varias ---------- */
PAGES.forEach(p=>p.fields.forEach((f,i)=>{ f._k=p.id+'_'+i; }));
function fmtEur(x){ return (Math.round(x*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2})+' €'; }
function vis(f, d){ if(f.only && f.only!==S.mode) return false; if(f.showIf && !f.showIf(d)) return false; return true; }
function pagesForMode(){ return PAGES; }
function idsOfPage(p){ return p.fields.filter(f=>f.id).map(f=>f.id); }

/* ---------- ¿campo relleno? ---------- */
function filled(f, d){
  switch(f.t){
    case 'text': case 'area': case 'num': case 'radio': case 'probpick': return d[f.id]!==undefined && String(d[f.id]).trim()!=='';
    case 'checks': return Array.isArray(d[f.id]) && d[f.id].length >= (f.min||1);
    case 'table': { const o=d[f.id]||{}; return (f.reqRows||f.rows.map(r=>r[0])).every(r=>o[r]); }
    case 'frase': return Object.keys(f.blanks).every(k=>String(d[f.id+'.'+k]||'').trim()!=='');
    case 'reqcheck': { const c=card(d.tarjeta); if(!c) return false; const o=d.rq||{}; return ['pos','cable','extra'].every(k=>o[k]); }
    case 'ranura': return +d.grosor>0 && +d.ranuraMed>0 && !!d.ranuraRes;
    case 'mods': { const m=d.modsSel||[]; if(!m.length) return false; return m.every(k=>(String(d['modTxt_'+k]||'').trim()!=='') && d['modPara_'+k]); }
    case 'guion': return [1,2,3,4].every(i=>String(d['g'+i+'b']||'').trim()!=='');
    case 'fases': { const items=fasesItems(); return items.every(it=>d['fa_'+it.k]); }
    case 'carita': return f.rows.every(r=>d[f.id+'_'+r[0]]);
    default: return true;
  }
}
function reqLabel(f){
  switch(f.t){
    case 'reqcheck': return L('Requisitos de la tarjeta (✔/✘)','Card requirements');
    case 'ranura': return L('La ranura: medidas y resultado','The slot: sizes and result');
    case 'mods': return L('Al menos una modificación con qué hiciste y para qué','At least one change: what and what for');
    case 'guion': return L('Las 4 partes del guion','The 4 script parts');
    case 'fases': return L('Elegir la fase de cada actividad','Choose the phase of each activity');
    case 'carita': return L('Autoevaluación','Self-assessment');
    default: return f.q || L('Campo','Field');
  }
}
function missing(p, d){ return p.fields.filter(f=>f.req && vis(f,d) && !filled(f,d)); }
function pageDone(p, d){ return missing(p,d).length===0; }

/* ---------- almacenamiento ---------- */
function persist(){
  try{ localStorage.setItem(APP+':data', JSON.stringify(S.data)); localStorage.setItem(APP+':lang', S.lang); }catch(e){}
  S.dirty = true;
}
function restore(){
  try{ const d = JSON.parse(localStorage.getItem(APP+':data')||'{}'); if(d && typeof d==='object') S.data = d; }catch(e){}
  try{ const l = localStorage.getItem(APP+':lang'); if(l) S.lang=l; }catch(e){}
  try{ S.lastCode = +localStorage.getItem(APP+':lastcode')||0; }catch(e){}
}
/* IndexedDB para fotos */
let dbp=null;
function db(){ if(dbp) return dbp; dbp = new Promise((res,rej)=>{ try{ const r=indexedDB.open(APP,1); r.onupgradeneeded=()=>r.result.createObjectStore('fotos'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); return dbp; }
async function idbAll(){ try{ const d=await db(); return await new Promise((res)=>{ const out={}; const tx=d.transaction('fotos'); const st=tx.objectStore('fotos'); const rq=st.openCursor(); rq.onsuccess=()=>{ const c=rq.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); }; rq.onerror=()=>res(out); }); }catch(e){ return {}; } }
async function idbPut(k,v){ try{ const d=await db(); await new Promise((res)=>{ const tx=d.transaction('fotos','readwrite'); tx.objectStore('fotos').put(v,k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }

/* ---------- código de guardado ---------- */
function b64u(bytes){ let s=''; const ch=0x8000; for(let i=0;i<bytes.length;i+=ch) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+ch)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function sum(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; } return (h%1296).toString(36).padStart(2,'0').toUpperCase(); }
async function pipe(bytes, Stream, fmt){ const s=new Blob([bytes]).stream().pipeThrough(new Stream(fmt)); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function makeCode(data){
  const json = JSON.stringify({v:VERSION, m:S.mode, d:data});
  const raw = new TextEncoder().encode(json);
  let body, pre;
  if(typeof CompressionStream!=='undefined'){ body=b64u(await pipe(raw, CompressionStream, 'deflate-raw')); pre='SDA1Z'; }
  else { body=b64u(raw); pre='SDA1J'; }
  return `${pre}-${body}-${sum(body)}`;
}
async function readCode(code){
  code = String(code||'').replace(/\s+/g,'');
  const m = code.match(/^(SDA1[ZJ])-([A-Za-z0-9_-]+)-([0-9A-Z]{2})$/);
  if(!m) throw new Error('formato');
  if(sum(m[2])!==m[3]) throw new Error('incompleto');
  let bytes = unb64u(m[2]);
  if(m[1]==='SDA1Z'){ if(typeof DecompressionStream==='undefined') throw new Error('navegador'); bytes = await pipe(bytes, DecompressionStream, 'deflate-raw'); }
  const obj = JSON.parse(new TextDecoder().decode(bytes));
  if(!obj || typeof obj.d!=='object') throw new Error('datos');
  return obj;
}

/* ---------- fotos: compresión ---------- */
function loadImg(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
async function compress(blob){
  const url = URL.createObjectURL(blob);
  try{
    const img = await loadImg(url);
    const max = 1100; let w=img.naturalWidth, h=img.naturalHeight; const k=Math.min(1, max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
async function setPhoto(id, blob){
  if(!blob || !/^image\//.test(blob.type)){ toast(L('Eso no es una imagen.','That is not an image.')); return; }
  const du = await compress(blob);
  S.photos[id]=du; await idbPut(id, du); S.data['_f_'+id]=1; persist(); renderPage(); toast(L('📷 Imagen añadida','Image added'));
}
async function delPhoto(id){ delete S.photos[id]; await idbDel(id); delete S.data['_f_'+id]; persist(); renderPage(); }

  const d=S.data;
  const items = PAGES.map((p,i)=>{ const st = pageDone(p,d)?'✅':(p.fields.some(f=>f.id && d[f.id]!==undefined)?'◐':'○'); return {i,p,st}; });

/* ---------- eventos ---------- */
function setVal(id, val){ if(val===''||val==null) delete S.data[id]; else S.data[id]=val; persist(); }
function onInput(e){
  const t=e.target;
  if(t.dataset && t.dataset.file) return;
  if(t.dataset && t.dataset.id){
    setVal(t.dataset.id, t.value);
    if(t.tagName==='SELECT') rerender(); else refreshDynamic();
    return;
  }
  if(t.type==='radio' || t.type==='checkbox'){
    const name=t.name;
    if(name.startsWith('rq__')){ const k=name.slice(4); const o=Object.assign({},S.data.rq||{}); o[k]=t.value; S.data.rq=o; }
    else if(name.includes('__')){ const [id,row]=name.split('__'); const o=Object.assign({},S.data[id]||{}); o[row]=t.value; S.data[id]=o; }
    else if(name==='modsSel' && t.type==='radio'){ S.data.modsSel=[t.value]; }
    else if(t.type==='checkbox'){ const a=new Set(S.data[name]||[]); t.checked?a.add(t.value):a.delete(t.value); S.data[name]=[...a]; if(!S.data[name].length) delete S.data[name]; }
    else S.data[name]=t.value;
    persist(); rerender();
  }
}
function rerender(){ const y=window.scrollY; renderPage(true); window.scrollTo(0,y); }
document.addEventListener('change', onInput);
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset && t.dataset.id && (t.tagName==='TEXTAREA' || t.type==='text' || t.type==='number')){ setVal(t.dataset.id, t.value); refreshDynamic(); } });
function updateFalta(){ renderNav(); }

document.addEventListener('click', async e=>{
  const b=e.target.closest('button, a, .slot');
  // glosario
  const g=e.target.closest('.gl'); if(g){ showGlos(g); return; } else hideGlos();
  if(!b) return;
  if(b.classList.contains('slot')){ activeSlot=b.dataset.slot; return; }
  if(b.dataset.goto!==undefined){ const i=+b.dataset.goto; if(i>=0 && i<PAGES.length){ go(i); } return; }
  if(b.dataset.say!==undefined){ speak(b.dataset.say); return; }
  if(b.dataset.step){ stepMove(+b.dataset.step); return; }
  if(b.dataset.bank){ const id=b.dataset.bank; const w=b.dataset.word; const el=document.querySelector(`[data-id="${CSS.escape(id)}"]`);
     let nv; if(el && el.tagName==='TEXTAREA' && el.value.trim()) nv = el.value.trim()+' '+w; else nv=w; setVal(id,nv); rerender(); return; }
  if(b.dataset.paste){ activeSlot=b.dataset.paste; await pasteFromClipboard(b.dataset.paste); return; }
  if(b.dataset.delphoto){ await delPhoto(b.dataset.delphoto); return; }
  const act=b.dataset.act;
  if(act==='faChk'){ S.data._faChk=1; persist(); rerender(); return; }
  if(act==='pdf'){ doPrint(false); return; }
  if(act==='save'){ openSave(); return; }
  if(act==='file'){ downloadFull(); return; }
  if(act==='teacher'){ openTeacher(); return; }
});
document.addEventListener('focusin', e=>{ const s=e.target.closest && e.target.closest('.slot'); if(s) activeSlot=s.dataset.slot; });
document.addEventListener('change', async e=>{ const t=e.target; if(t.dataset && t.dataset.file && t.files && t.files[0]){ await setPhoto(t.dataset.file, t.files[0]); t.value=''; } });
document.addEventListener('paste', async e=>{
  const items=[...(e.clipboardData && e.clipboardData.items || [])]; const it=items.find(i=>i.type.startsWith('image/'));
  if(!it) return;
  const id = activeSlot || (document.querySelector('[data-slot]')||{}).dataset?.slot;
  if(!id){ toast(L('En esta página no hay sitio para imágenes.','There is no image box on this page.')); return; }

});
async function pasteFromClipboard(id){
  try{
    if(!navigator.clipboard || !navigator.clipboard.read) throw 0;
    const items = await navigator.clipboard.read();
    for(const it of items){ const tp=it.types.find(t=>t.startsWith('image/')); if(tp){ await setPhoto(id, await it.getType(tp)); return; } }
    toast(L('No hay ninguna imagen copiada. Haz una captura (Win + Shift + S) y vuelve a pulsar.','No image copied. Take a screenshot (Win + Shift + S) and try again.'));
  }catch(err){ toast(L('Haz clic en el recuadro y pulsa Ctrl + V.','Click the box and press Ctrl + V.')); const s=document.querySelector(`[data-slot="${CSS.escape(id)}"]`); if(s) s.focus(); }
}

document.getElementById('bSave').addEventListener('click', openSave);
document.getElementById('bLoad').addEventListener('click', openLoad);

function stepMove(dir){
  const p=PAGES[S.page]; const n=document.querySelectorAll('[data-blk]').length; let s=(S.step[p.id]||0)+dir;
  if(s>=n){ S.step[p.id]=n-1; if(S.page<PAGES.length-1) go(S.page+1); return; }
  S.step[p.id]=Math.max(0,s); renderPage(true);
  const el=document.querySelector('[data-blk]:not([hidden])'); if(el) el.scrollIntoView({block:'center'});
}
function go(i){
  const prev=S.page; S.page=i; try{ localStorage.setItem(APP+':page', i); }catch(e){}
  renderPage();
  if(S.dirty && Date.now()-S.lastCode > 20*60*1000 && prev!==i){ toast(L('💾 ¿Has guardado tu código hoy? Pulsa «Guardar código».','Have you saved your code today? Press "Save code".'), 5000); S.lastCode = Date.now()-10*60*1000; }
}

let glEl=null;
function showGlos(btn){ hideGlos(); const k=btn.dataset.gl; const o=GLOS[k]; if(!o) return; glEl=document.createElement('div'); glEl.className='glpop'; glEl.innerHTML=`<b>${esc(k)}</b> <button type="button" class="say" data-say="${esc(sayText(o))}">🔊</button><br>${bi(o)}`; document.body.appendChild(glEl); const r=btn.getBoundingClientRect(); glEl.style.left=Math.max(8,Math.min(window.scrollX+r.left, window.scrollX+document.documentElement.clientWidth-340))+'px'; glEl.style.top=(window.scrollY+r.bottom+6)+'px'; }

/* ---------- voz ---------- */
function speak(text){
  try{ if(!('speechSynthesis' in window)){ toast(L('Este navegador no puede leer en voz alta.','This browser cannot read aloud.')); return; }
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const lang=S.lang==='en'?'en-GB':'es-ES'; u.lang=lang; u.rate=0.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2))); if(v) u.voice=v; speechSynthesis.speak(u);
  }catch(e){}
}

    catch(err){ toast(L(err.message==='incompleto'?'El código está incompleto: cópialo entero, desde SDA1 hasta el final.':err.message==='navegador'?'Este navegador es antiguo. Usa Chrome o Edge.':'Ese código no es válido. Copia el código completo.','That code is not valid. Copy the whole code.'),4500); }
  });
  m.querySelector('#inFile').addEventListener('change', async e=>{ const f=e.target.files[0]; if(!f) return; try{ const obj=JSON.parse(await f.text()); if(obj.app!==APP) throw 0; S.data=obj.d||{}; applyMode(); persist(); await idbClear(); S.photos={}; for(const [k,v] of Object.entries(obj.f||{})){ S.photos[k]=v; await idbPut(k,v); } m.remove(); go(firstPending()); toast(L('✔ Archivo cargado con sus fotos.','File loaded with photos.'),3500);}catch(err){ toast(L('Ese archivo no es una memoria válida.','That file is not a valid report.'),4000);} });
}
function firstPending(){ const i=PAGES.findIndex(p=>!pageDone(p,S.data)); return i<0?PAGES.length-1:i; }
function downloadFull(){
  const obj={app:APP, v:VERSION, m:S.mode, d:S.data, f:S.photos, fecha:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});
  const name=(S.data.nombre1||'memoria').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').slice(0,40);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${name}.memoria`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  modal(`<h2>📦 ${bi(L('Archivo completo descargado','Full file downloaded'),true)}</h2><ol class="guide"><li>${bi(L('Busca el archivo en <b>Descargas</b>.','Find the file in Downloads.'))}</li><li>${bi(L('Súbelo a tu <b>Drive</b> (Nuevo → Subir archivo).','Upload it to your Drive (New → File upload).'))}</li><li>${bi(L('Otro día: descárgalo de Drive y ábrelo con 📂 Continuar → Abrir archivo completo.','Another day: download it and open it with Continue → Open full file.'))}</li></ol><div class="row"><button class="btn pri" data-close>OK</button></div>`);
}
function openMore(){
  const m = modal(`<h2>☰ ${bi(L('Más opciones','More options'),true)}</h2>
   <div class="row" style="flex-direction:column;align-items:stretch">
    <button class="btn" data-x="pdf">🖨️ ${bi(L('Sacar PDF de mi memoria','Make a PDF of my report'),true)}</button>
    <button class="btn" data-x="blank">📄 ${bi(L('Imprimir la memoria en blanco (para hacerla a mano)','Print a blank report (to do by hand)'),true)}</button>
    <button class="btn" data-x="file">📦 ${bi(L('Descargar archivo completo (con fotos)','Download full file (with photos)'),true)}</button>
    <button class="btn" data-x="teacher">👩‍🏫 ${bi(L('Profesor/a: ver la memoria de un código','Teacher: view a report from a code'),true)}</button>
    <button class="btn" data-x="theme">🌓 ${bi(L('Cambiar modo claro / oscuro','Toggle light / dark mode'),true)}</button>
    <button class="btn del" data-x="reset">🗑️ ${bi(L('Borrar todo lo de este ordenador','Delete everything on this computer'),true)}</button>
   </div><div class="row"><button class="btn" data-close>✖ ${S.lang==='en'?'Close':'Cerrar'}</button></div>`);
  m.addEventListener('click', async e=>{ const x=e.target.closest('[data-x]'); if(!x) return; const a=x.dataset.x; m.remove();
    if(a==='pdf') doPrint(false); if(a==='blank') doPrint(true); if(a==='file') downloadFull(); if(a==='teacher') openTeacher();
    if(a==='theme'){ const r=document.documentElement; const cur=r.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.setAttribute('data-theme', cur==='dark'?'light':'dark'); try{localStorage.setItem(APP+':theme', r.getAttribute('data-theme'));}catch(e){} }
    if(a==='reset'){ const c=modal(`<h2>🗑️ ${bi(L('¿Seguro?','Are you sure?'),true)}</h2><p>${bi(L('Se borran las respuestas y las fotos de ESTE ordenador. Tu código guardado en Drive no se borra.','Answers and photos on THIS computer are deleted. Your code in Drive is not deleted.'))}</p><div class="row"><button class="btn del" id="yes">🗑️ ${S.lang==='en'?'Delete':'Borrar'}</button><button class="btn" data-close>${S.lang==='en'?'Cancel':'Cancelar'}</button></div>`); c.querySelector('#yes').onclick=async()=>{ S.data={}; S.photos={}; await idbClear(); persist(); c.remove(); go(0); }; }
  });
}

/* ---------- profesor ---------- */
function openTeacher(){
  const m = modal(`<h2>👩‍🏫 ${bi(L('Ver la memoria de un alumno','View a student\'s report'),true)}</h2>
   <p>${bi(L('Pega el código que te ha entregado el alumno. Se abre una vista para corregir e imprimir. <b>No se modifica</b> lo guardado en este ordenador.','Paste the student\'s code. A view to mark and print opens. Nothing saved on this computer is changed.'))}</p>
   <textarea class="code" id="tTa" placeholder="SDA1Z-..."></textarea>
   <div class="row"><button class="btn pri" id="tGo">👁️ ${S.lang==='en'?'View':'Ver'}</button><button class="btn" data-close>✖</button></div>`);
  m.querySelector('#tGo').addEventListener('click', async ()=>{
    try{ const obj=await readCode(m.querySelector('#tTa').value); m.remove(); const prevMode=S.mode; S.mode=obj.m||'n'; const html=buildReport(obj.d||{}, {}, false, true); S.mode=prevMode;
      const v=modal(`<div style="display:flex;gap:10px;justify-content:space-between;align-items:center"><h2 style="margin:0">${bi(L('Memoria de','Report of'),true)} ${esc(obj.d && obj.d.nombre1 || '—')} ${obj.m==='r'?'<span class="modebadge" style="background:var(--soft)">Refuerzo</span>':''}</h2><div><button class="btn pri" id="tPr">🖨️ PDF</button> <button class="btn" data-close>✖</button></div></div><div id="tv" class="rep" style="margin-top:10px">${html}</div>`);
      v.querySelector('.box').style.maxWidth='900px';
      v.querySelector('#tPr').onclick=()=>{ const prevMode2=S.mode; S.mode=obj.m||'n'; document.getElementById('print').innerHTML=buildReport(obj.d||{}, {}, false, false); S.mode=prevMode2; v.remove(); setTimeout(()=>window.print(),60); };
    }catch(err){ toast(L('Código no válido o incompleto.','Invalid or incomplete code.'),3500); }
  });
}

/* ---------- informe imprimible ---------- */
function ansText(f, d){
  const v=d[f.id];
  switch(f.t){
    case 'text': case 'area': case 'num': return v!==undefined && v!=='' ? esc(v)+(f.unit?' '+esc(f.unit):'') : '';
    case 'radio': { const o=(f.opts||[]).find(o=>o[0]===v); return o?(typeof o[1]==='string'?esc(o[1]):biP(o[1])):''; }
    case 'checks': { const a=Array.isArray(v)?v:[]; return a.map(k=>{ const o=f.opts.find(o=>o[0]===k); return o?'☑ '+biP(o[1]):''; }).join('<br>'); }
    case 'frase': { let t=tx(f.tpl, S.lang==='en'?'en':'es'); Object.keys(f.blanks).forEach(k=>{ const x=d[f.id+'.'+k]; t=t.replace('{'+k+'}', x?`<u>${esc(x)}</u>`:'_______________'); }); return t; }
    case 'probpick': { const c=card(v); return c?biP(c.prob):''; }
  }
  return '';
}
function buildReport(d, photos, blank, screen){
  const D = blank ? {} : d;
  const out=[];
  const sigBox = `<div class="firma"><span>☐ ${biP(L('Falté a esta sesión y he hecho la ficha de recuperación','I missed this session and did the catch-up sheet'))}</span><span><b>${biP(L('Firma del profesor y fecha','Teacher signature and date'))}</b></span></div>`;
  out.push(`<div class="pp cover"><h1>Hecho a medida</h1><p><i>Made to measure</i> · ${biP(L('Memoria técnica · Tecnología 4.º ESO','Technical report'))}${S.mode==='r'?' · R':''}</p>`);
  PAGES.forEach((p,i)=>{
    if(p.id==='entregar') return;
    const fs=p.fields.filter(f=> (f.only?f.only===S.mode:true) && (blank || !f.showIf || f.showIf(D)));
    let h = (i===0?'':`<div class="pp">`) + `<h2>${p.icon} ${i+1}. ${biP(p.title)}</h2>`;
    fs.forEach(f=>{
      const star = f.req?'★ ':'';
      if(f.t==='sub'){ h+=`<div class="pq" style="font-size:11.5pt;color:#1f4f80">${biP(f.q)}</div>`; return; }
      if(f.t==='html' || f.t==='download'){ return; }
      if(f.t==='calc'){ if(!blank){ const t=document.createElement('div'); t.innerHTML=f.html(D); h+=`<div class="pa" style="border:0">${esc(t.textContent)}</div>`; } return; }
      if(f.t==='card'){ const c=card(D[f.key]); h+= c?`<table><tr><th>${c.emoji} ${esc(c.nombre)}</th><td>${biP(c.prob)}</td></tr><tr><th>${biP(L('Uso','Use'))}</th><td>${biP(USO[c.uso])} · ${biP(c.pos)} · ${c.cable?'🔌':''} ⚠️ ${biP(c.extra)}</td></tr></table>`: (blank?`<div class="pq">${biP(L('Tarjeta nº','Card no.'))} ____ · ${biP(L('Nombre','Name'))} ______________</div>`:''); return; }
      if(f.t==='photo'){ const src=photos[f.id]; h+=`<div class="pq">${biP(f.q)}</div>` + (src?`<img src="${src}" alt="">`:(blank||screen?`<div class="pbox">${biP(L('Pega aquí la foto o captura','Stick the photo or screenshot here'))}</div>`:`<div class="pa note">—</div>`)); return; }
      if(f.t==='table'){ const o=D[f.id]||{}; h+=`<div class="pq">${star}${biP(f.q)}</div><table><tr><th></th>${f.cols.map(c=>`<th>${biP(c[1])}</th>`).join('')}</tr>${f.rows.map(r=>`<tr><td>${biP(r[1])}</td>${f.cols.map(c=>`<td style="text-align:center">${o[r[0]]===c[0]?'☒':'☐'}</td>`).join('')}</tr>`).join('')}</table>`; return; }
      if(f.t==='radio' && blank){ h+=`<div class="pq">${star}${biP(f.q)}</div><div class="pa" style="border:0">${f.opts.map(o=>'☐ '+(typeof o[1]==='string'?esc(o[1]):biP(o[1]))).join(' &nbsp; ')}</div>`; return; }
      if(f.t==='checks' && blank){ h+=`<div class="pq">${star}${biP(f.q)}</div><div class="pa" style="border:0">${f.opts.map(o=>'☐ '+biP(o[1])).join('<br>')}</div>`; return; }
      if(f.t==='reqcheck'){ const c=card(D.tarjeta); const o=D.rq||{}; const mk=k=>o[k]==='si'?'✔':o[k]==='no'?'✘':o[k]==='na'?'—':'☐ ✔ ☐ ✘';
        h+=`<div class="pq">★ ${biP(L('Requisitos de mi tarjeta','My card requirements'))}</div><table><tr><td>${biP(L('Posición del móvil','Phone position'))}${c?' ('+biP(USO[c.uso])+')':''}</td><td>${mk('pos')}</td></tr><tr><td>${biP(L('Orificio para el cable (si carga)','Cable hole (if charging)'))}</td><td>${mk('cable')}</td></tr><tr><td>⚠️ ${c?biP(c.extra):biP(L('Además…','Also…'))}</td><td>${mk('extra')}</td></tr></table>`; return; }
      if(f.t==='ranura'){ const r={bien:L('cabe bien','fits well'),justo:L('queda justo','is tight'),nocabe:L('no cabe','does not fit'),suelto:L('queda suelto','is loose')}[D.ranuraRes];
        h+=`<div class="pq">★ ${biP(L('La ranura','The slot'))}</div><table><tr><td>${biP(L('Grosor del móvil con funda','Phone thickness with case'))}</td><td>${D.grosor?esc(D.grosor)+' mm':'_____ mm'}</td><td>${biP(L('Ranura del soporte','Stand slot'))}</td><td>${D.ranuraMed?esc(D.ranuraMed)+' mm':'_____ mm'}</td></tr><tr><td>${biP(L('Resultado','Result'))}</td><td colspan="3">${r?biP(r):'☐ '+biP(L('cabe bien','fits well'))+' ☐ '+biP(L('justo','tight'))+' ☐ '+biP(L('no cabe','does not fit'))+' ☐ '+biP(L('suelto','loose'))}</td></tr></table>`; return; }
      if(f.t==='mods'){ const sel=D.modsSel||[]; h+=`<div class="pq">★ ${biP(L('Mis modificaciones','My modifications'))}</div><table><tr><th>${biP(L('Cambio','Change'))}</th><th>${biP(L('Qué hice','What I did'))}</th><th>${biP(L('Para qué sirve','What it is for'))}</th></tr>${(blank?MODS:MODS.filter(m=>sel.includes(m[0]))).map(m=>{ const pp=PARA.find(p=>p[0]===D['modPara_'+m[0]]); return `<tr><td>${blank?'☐ ':''}${biP(m[1])}</td><td>${esc(D['modTxt_'+m[0]]||'')}</td><td>${pp?biP(pp[1]):''}</td></tr>`; }).join('')}</table>`; return; }
      if(f.t==='matrix'){ const crit=[['estable',L('Es estable','Stable')],['facil',L('Fácil de imprimir','Easy to print')],['gusta',L('Me ha salido bien','Came out well')]]; h+=`<div class="pq">${biP(L('Puntuación (1–3)','Scores (1–3)'))}</div><table><tr><th></th><th>S1</th><th>S2</th><th>S3</th></tr>${crit.map(c=>`<tr><td>${biP(c[1])}</td>${[1,2,3].map(n=>`<td style="text-align:center">${esc(D[`mx_${c[0]}_${n}`]||'')}</td>`).join('')}</tr>`).join('')}</table>`; return; }
      if(f.t==='guion'){ h+=`<div class="pq">★ ${biP(L('Guion','Script'))}</div><table><tr><th></th><th>${biP(L('Qué se ve','What we see'))}</th><th>${biP(L('Qué digo','What I say'))}</th></tr>${[1,2,3,4].map(i=>`<tr><td>${i}</td><td>${esc(D['g'+i+'a']||'')}&nbsp;</td><td>${esc(D['g'+i+'b']||'')}&nbsp;</td></tr>`).join('')}</table>`; return; }
      if(f.t==='fases'){ const items=fasesItems(); h+=`<div class="pq">★ ${biP(L('Fase del proceso tecnológico de cada actividad','Phase of each activity'))}</div><table>${items.map(it=>{ const fz=FASES.find(x=>x[0]===D['fa_'+it.k]); return `<tr><td>${biP(it.t)}</td><td>${fz?biP(fz[1]):'__________'}</td></tr>`; }).join('')}</table>${blank?`<div class="note" style="font-size:8pt">1 Problema · 2 Información · 3 Diseño · 4 Planificación · 5 Fabricación · 6 Evaluación · 7 Difusión</div>`:''}`; return; }
      if(f.t==='carita'){ const cols=['😟','😐','🙂','😀']; h+=`<div class="pq">★ ${biP(L('Autoevaluación','Self-assessment'))}</div><table><tr><th></th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${f.rows.map(r=>`<tr><td>${biP(r[1])}</td>${cols.map((c,i)=>`<td style="text-align:center">${D[f.id+'_'+r[0]]===String(i+1)?'☒':'☐'}</td>`).join('')}</tr>`).join('')}</table>`; return; }
      if(f.t==='entrega') return;
      const a = ansText(f, D);
      h+=`<div class="pq">${star}${biP(f.req?noStar(f.q):(f.q||''))}</div><div class="pa ${a?'':'empty'} ${f.t==='area'&&!a?'big':''}">${a}</div>`;
    });
    h+= sigBox + `</div>`;
    out.push(h);
  });
  return out.join('');
}
async function doPrint(blank){
  const photos = blank?{}:S.photos;
  document.getElementById('print').innerHTML = buildReport(S.data, photos, blank, false);
  const imgs=[...document.querySelectorAll('#print img')]; await Promise.all(imgs.map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
  setTimeout(()=>window.print(), 80);
}

/* ---------- arranque ---------- */
function applyMode(){
  const q=new URLSearchParams(location.search);
  if(q.get('r')==='1'){ S.mode='r'; S.data._modo='r'; }
  else if(q.get('r')==='0'){ S.mode='n'; delete S.data._modo; }
  else S.mode = S.data._modo==='r' ? 'r' : 'n';
  document.getElementById('modebadge').hidden = S.mode!=='r';
  document.documentElement.style.setProperty('--fs', S.mode==='r' ? '20px' : '');
}
(async function init(){
  restore();
  try{ const th=localStorage.getItem(APP+':theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
  applyMode();
  document.getElementById('lang').value=S.lang;
  try{ const pg=+localStorage.getItem(APP+':page'); if(pg>=0 && pg<PAGES.length) S.page=pg; }catch(e){}
  S.photos = await idbAll();
  renderPage();
})();
</script>
